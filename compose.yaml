services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: uptimerobot
      POSTGRES_USER: uptimerobot
      POSTGRES_PASSWORD: uptimerobot
    ports:
      - "5432:5432"
    volumes:
      - uptimerobot-postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - uptimerobot-keycloak-data:/opt/keycloak/data

volumes:
  uptimerobot-postgres-data:
  uptimerobot-keycloak-data:
